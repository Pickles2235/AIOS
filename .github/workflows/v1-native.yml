name: Apple Silicon product gates and developer smoke

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: V1 release version, for example 1.0.0
        required: false
        type: string

permissions:
  contents: read

jobs:
  native-core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: macos-arm64
          - runner: ubuntu-24.04
            target: linux-amd64
    name: ${{ matrix.target == 'macos-arm64' && 'Apple Silicon product' || 'Linux developer smoke' }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix web
      - run: go test ./...
        env:
          CGO_ENABLED: "1"
      - run: go vet ./...
        env:
          CGO_ENABLED: "1"
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: npm test --prefix web
      - name: Build embedded UI
        run: npm run build --prefix web
      - name: Build native binary
        run: go build -trimpath -o bin/aios ./cmd/aios
        env:
          CGO_ENABLED: "1"
      - name: Verify native login Git authentication and namespace transitions
        if: matrix.target == 'macos-arm64'
        run: |
          npm exec --prefix web -- playwright install chromium
          python3 scripts/verify_onboarding_native.py --output "$RUNNER_TEMP/onboarding-native.json"
      - name: Run native deterministic acceptance
        run: python3 scripts/v1_acceptance.py --binary "$PWD/bin/aios" --output-dir "$RUNNER_TEMP/acceptance-v1"
      - name: Install native browser for Apple Silicon first-run checks
        if: matrix.target == 'macos-arm64'
        run: npm exec --prefix web -- playwright install chromium
      - name: Verify Apple Silicon candidate installation and first run
        if: matrix.target == 'macos-arm64'
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: ./scripts/verify-macos-first-run.sh --version 1.0.0-harness --output-dir "$RUNNER_TEMP/macos-first-run"
      - name: Verify disposable per-user daemon and ZIP installation
        if: matrix.target == 'macos-arm64'
        run: python3 scripts/verify_daemon_native.py --output "$RUNNER_TEMP/daemon-native.json"
      - uses: actions/upload-artifact@v4
        if: always() && matrix.target == 'macos-arm64'
        with:
          name: macos-first-run-evidence
          path: |
            ${{ runner.temp }}/acceptance-v1/acceptance-report.json
            ${{ runner.temp }}/macos-first-run/environment.txt
            ${{ runner.temp }}/macos-first-run/archive.sha256.txt
            ${{ runner.temp }}/macos-first-run/installed-binary.txt
            ${{ runner.temp }}/macos-first-run/fingerprints.txt
            ${{ runner.temp }}/daemon-native.json
            ${{ runner.temp }}/onboarding-native.json
            ${{ runner.temp }}/macos-first-run/acceptance-*/acceptance-report.json
            web/playwright-report
            web/test-results
          if-no-files-found: warn
      - name: Package Unix release
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != '' && matrix.target == 'macos-arm64'
        run: ./scripts/build-v1-release.sh --version '${{ inputs.release_version }}' --output-dir release
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != '' && matrix.target == 'macos-arm64'
        with:
          name: aios-${{ inputs.release_version }}-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
